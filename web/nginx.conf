server {
  listen 80;
  server_name _;

  # Root of built Vite app
  root /usr/share/nginx/html;
  index index.html;

  # Gzip/brotli hints (brotli not enabled by default in stock nginx)
  gzip on;
  gzip_types text/plain application/xml text/css application/javascript application/json image/svg+xml;

  # Cache immutable assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API proxy to backend service in the same docker-compose network
  # Avoid double-prefix issues by not appending /api/ in proxy_pass and preserving URI
  location /api/ {
    # Preserve the original /api/... path
    # Option A: direct pass-through without rewriting (recommended)
    proxy_pass http://backend:8080;
    # If you need to force-normalize the URI to always include /api prefix:
    # rewrite ^/api/(.*)$ /api/$1 break;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA history fallback
  location / {
    try_files $uri /index.html;
  }

  # Health endpoint for container healthcheck
  location = /healthz {
    return 200 "ok";
    add_header Content-Type text/plain;
  }

  # Basic security headers
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-XSS-Protection "1; mode=block";
}