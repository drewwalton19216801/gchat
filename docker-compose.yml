services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: gchat-backend:latest
    environment:
      # Map envs as needed; override via .env or CLI
      # OPENROUTER_API_KEY: your-key
      # Additional vars: see backend/.env.example
      GIN_MODE: release
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - gchat

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: gchat-frontend:latest
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - gchat

networks:
  gchat:
    driver: bridge